<title>Arrows in word space</title>
<style>
:root{--bg:#fcfcfb;--fg:#1a1a1c;--muted:#66646a;--dot:#9a979c;--rule:#e2e0e2;--accent:#a3182b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161416;--fg:#ece9ea;--muted:#a29da2;--dot:#6c676c;--rule:#302c30;--accent:#e8707f}}
:root[data-theme="dark"]{--bg:#161416;--fg:#ece9ea;--muted:#a29da2;--dot:#6c676c;--rule:#302c30;--accent:#e8707f}
:root[data-theme="light"]{--bg:#fcfcfb;--fg:#1a1a1c;--muted:#66646a;--dot:#9a979c;--rule:#e2e0e2;--accent:#a3182b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:"Alegreya Sans","Gill Sans","Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.4;padding:0 16px;overflow-x:hidden}
main{max-width:860px;margin:0 auto;padding:6px 0 18px}
button,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px}
.tabs{display:flex;gap:22px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:7px 0;color:var(--muted);cursor:pointer;font-size:17px;transition:color .3s,border-color .3s}
.tab[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.act{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;min-width:36px;padding:0 10px;border:1px solid var(--rule);border-radius:18px;background:none;cursor:pointer;color:var(--fg);transition:border-color .3s}
.act:hover{border-color:var(--muted)}
.act svg{width:14px;height:14px;fill:currentColor;display:block}
.act .t,.act .ipl{display:none}
body[data-mode="try"] .act .t,body[data-mode="try"] .act .ipl,body.paused .act .ipl{display:inline;display:block}
body[data-mode="try"] .act .t{display:inline;padding-right:4px}
body[data-mode="try"] .act .ip,body.paused .act .ip{display:none}
.prompt{position:relative;min-height:calc(1.4em * 2 + 16px);border-bottom:1px solid var(--rule);transition:border-color .3s;font-size:19px}
.prompt:focus-within{border-bottom-color:var(--accent)}
.mirror,.prompt textarea{display:block;width:100%;margin:0;padding:8px 0;border:0;font-size:19px;line-height:1.4;letter-spacing:0;white-space:pre-wrap;overflow-wrap:anywhere;font-family:inherit}
.mirror{pointer-events:none;transition:opacity .5s;min-height:calc(1.4em + 16px)}
.mirror.off{opacity:0}
.prompt textarea{position:absolute;inset:0;height:100%;resize:none;overflow:hidden;background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--fg);outline:none}
body[data-mode="watch"] .prompt textarea{display:none}
@media (max-width:560px){.prompt{min-height:calc(1.4em * 3 + 16px)}}
.w{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-skip-ink:none}
.w-dashed{text-decoration-style:dashed}.w-dotted{text-decoration-style:dotted;text-decoration-thickness:3px}.w-double{text-decoration-style:double;text-decoration-thickness:1.5px}.w-wavy{text-decoration-style:wavy;text-decoration-thickness:1.5px;text-underline-offset:3px}.w-thick{text-decoration-thickness:4px}
.caret{display:inline-block;width:2px;height:1.05em;margin-left:1px;vertical-align:-.15em;background:var(--fg);animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.stage{position:relative;width:100%;margin-top:6px}
canvas{display:block;width:100%;touch-action:pan-y}
.steps{list-style:none;margin:2px 0 0;padding:0;min-height:1.6em;display:flex;flex-wrap:wrap;color:var(--muted);font-size:16px}
.steps li{transition:color .3s,opacity .3s}
.steps li+li::before{content:"\2192";margin:0 .5em;color:var(--rule)}
.steps li.d{color:var(--fg)}
.steps li.c{color:var(--accent)}
body[data-mode="watch"] .steps li.f{opacity:0}
.note{margin:14px 0 0;font-size:14px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>

<main>
<div class="bar">
<div class="tabs"><button class="tab" id="tw" type="button" aria-pressed="true">Watch</button><button class="tab" id="tt" type="button" aria-pressed="false">Try it</button></div>
<button class="act" id="act" type="button" aria-label="Pause"><svg class="ip" viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="1" width="3.5" height="12" rx="1"/><rect x="8.5" y="1" width="3.5" height="12" rx="1"/></svg><svg class="ipl" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.2v11.6L12.6 7z"/></svg><span class="t">Run</span></button>
</div>
<div class="prompt"><div class="mirror" id="mirror" aria-hidden="true"></div><textarea id="input" rows="1" maxlength="120" spellcheck="false" autocomplete="off" aria-label="Instruction for the agent"></textarea></div>
<div class="stage" id="stage"><canvas id="cv" role="img" aria-label="Map of 5,000 words"></canvas></div>
<ol class="steps" id="steps" aria-label="Agent steps"></ol>
<p class="note">Real word vectors for 5,000 words (spaCy), flattened from 300 dimensions to two.</p>
<div class="sr" id="live" aria-live="polite"></div>
</main>

var cam={x:new S(.5),y:new S(.4),z:new S(1)};
var BX0=1,BX1=0,BY0=1,BY1=0;

  nbs.forEach(function(w){seen[w]=1;cand.push({key:WORDS[w],text:WORDS[w],font:F_NB,col:C.fg,x:sx(XY[2*w]),y:sy(XY[2*w+1]),gap:6,pri:1,dot:w})});

/* ---------- state ---------- */
var PROMPTS=['rename fragments to notes and move them under Writing','fix the bug where the Source button writes into the wrong field','add a visuals section with a run button','make the site easy for search engines to find'];
var PLANS=PROMPTS.map(function(p){return plan(parse(p))});

  if(mode==='watch'){

    out.P=P;out.typed=txt.slice(0,clamp(Math.floor((t-T0)/CH),0,txt.length));out.caret=t<T.typeEnd+.6;

  g.textBaseline='middle';
  Object.keys(shown).forEach(function(key){
    var s=shown[key];if(s.a<.01)return;var c=s.c;
    g.font=c.font;g.globalAlpha=s.a*(c.pri<2?fa:1);
    g.lineWidth=3;g.strokeStyle=C.bg;g.lineJoin='round';g.strokeText(c.text,s.r.x+1,s.r.y+LH/2);
    g.fillStyle=c.col;g.fillText(c.text,s.r.x+1,s.r.y+LH/2);
  });
  g.globalAlpha=1;
  renderMirror(st);renderSteps(st);describe(st);
  mirror.classList.toggle('off',mode==='watch'&&fa<.6);
}

/* ---------- loop and controls ---------- */
function tick(dt){
  if(mode==='watch'&&!paused){
    WT.t+=dt;var T=times(PLANS[WT.pi],PROMPTS[WT.pi]);
    if(WT.t>T.end+1.6){WT.pi=(WT.pi+1)%PROMPTS.length;WT.t=0}
  }
  if(mode==='try'&&TRY.run>=0&&TRY.P){TRY.run+=dt;if(TRY.run>TRY.P.steps.length*STEP+1)TRY.run=TRY.P.steps.length*STEP+1}
  frame(dt);
}
var last=0,raf=0;
function loop(ts){raf=0;var dt=last?Math.min((ts-last)/1000,.05):.016;last=ts;tick(dt);if(!hidden)raf=requestAnimationFrame(loop)}
function wake(){if(!raf&&!hidden){last=0;raf=requestAnimationFrame(loop)}}
function setMode(m){
  mode=m;document.body.setAttribute('data-mode',m);
  $('tw').setAttribute('aria-pressed',m==='watch');$('tt').setAttribute('aria-pressed',m==='try');
  mirrorSig='';chipSig='';shown={};
  if(m==='try'){if(!input.value)input.value=PROMPTS[3];tryApply(true);act.setAttribute('aria-label','Run the agent')}
  else{WT.t=0;act.setAttribute('aria-label',paused?'Play':'Pause')}
  wake();
}
function tryApply(force){
  var txt=input.value.replace(/\n/g,' ');if(!force&&txt===TRY.text)return;
  TRY.text=txt;TRY.P=plan(parse(txt));TRY.run=-1;mirrorSig='';
}
$('tw').addEventListener('click',function(){setMode('watch')});
$('tt').addEventListener('click',function(){setMode('try');input.focus()});
act.addEventListener('click',function(){
  if(mode==='try'){if(TRY.P&&TRY.P.steps.length)TRY.run=0;wake();return}
  paused=!paused;document.body.classList.toggle('paused',paused);act.setAttribute('aria-label',paused?'Play':'Pause');wake();
});
input.addEventListener('input',function(){tryApply(false);wake()});
input.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();if(TRY.P&&TRY.P.steps.length)TRY.run=0;wake()}});
document.addEventListener('visibilitychange',function(){hidden=document.hidden;if(!hidden)wake()});
if(window.IntersectionObserver)new IntersectionObserver(function(es){hidden=!es[0].isIntersecting||document.hidden;if(!hidden)wake()}).observe(stage);
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){readTheme();wake()})}catch(e){}
new MutationObserver(function(){readTheme();wake()}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
if(window.ResizeObserver)new ResizeObserver(function(){layout();wake()}).observe(stage);else addEventListener('resize',function(){layout();wake()});
readTheme();layout();
if(RM){
  /* reduced motion: a settled frame of the first prompt, which plays only on request */
  paused=true;document.body.classList.add('paused');act.setAttribute('aria-label','Play');
  var T=times(PLANS[0],PROMPTS[0]);WT.t=T.end-.2;
  camTo(state().camPts);cam.x.snap();cam.y.snap();cam.z.snap();
}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){widths={};wake()});
wake();
})();
</script>
